<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGen Pro - Automation Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-weight: 800;
            margin-top: 0;
            font-size: 2rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        textarea {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-main);
            font-family: monospace;
            resize: vertical;
            min-height: 100px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }

        input[type="text"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            color: white;
        }

        button {
            background: linear-gradient(135deg, var(--accent), #2563eb);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* Unique Progress Ring Indicator */
        .progress-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 40px 0;
        }

        .circular-progress {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 3.6deg, rgba(255,255,255,0.05) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: background 0.4s ease;
        }

        .circular-progress::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--bg-dark);
        }

        .progress-value {
            position: relative;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .progress-text {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Mock Data Table */
        .data-table {
            display: none;
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            overflow: hidden;
        }

        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .data-table th {
            background: rgba(255,255,255,0.05);
            font-weight: 600;
            color: var(--text-muted);
        }

        .data-table tr:hover {
            background: rgba(255,255,255,0.02);
        }
        
        .badge {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>LeadGen Pro</h1>
        <p class="subtitle">Next-gen Instagram scraper interface.</p>

        <div class="input-group">
            <textarea id="handles" placeholder="Paste Instagram handles here (one per line)...&#10;curlygalchlosalon&#10;barbershoptokyo&#10;..."></textarea>
            
            <div class="controls">
                <input type="text" placeholder="Session ID (sessionid)" id="session">
                <button onclick="startDemo()">Start Extraction</button>
            </div>
        </div>

        <div class="progress-container" id="progressArea">
            <div class="circular-progress" id="circProgress">
                <span class="progress-value" id="progValue">0%</span>
            </div>
            <div class="progress-text" id="progText">Initializing secure connection...</div>
        </div>

        <table class="data-table" id="resultsTable">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Handle</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data goes here -->
            </tbody>
        </table>
    </div>

    <script>
        function startDemo() {
            const handles = document.getElementById('handles').value.split('\n').filter(h => h.trim() !== '');
            if(handles.length === 0) {
                alert("Please paste some handles first!");
                return;
            }

            document.getElementById('progressArea').style.display = 'flex';
            document.getElementById('resultsTable').style.display = 'table';
            document.getElementById('tableBody').innerHTML = '';
            
            let progress = 0;
            let currentItem = 0;
            const totalItems = handles.length;
            
            const progressRing = document.getElementById('circProgress');
            const progressVal = document.getElementById('progValue');
            const progressText = document.getElementById('progText');
            const tbody = document.getElementById('tableBody');

            // Simulate scraping process
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1;
                
                if(progress >= (currentItem + 1) * (100/totalItems) && currentItem < totalItems) {
                    // "Scraped" an item
                    const handle = handles[currentItem];
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><span class="badge">Success</span></td>
                        <td>@${handle}</td>
                        <td>Mock Business Name</td>
                        <td>contact@${handle}.com</td>
                    `;
                    // Simple fade in animation
                    tr.style.opacity = '0';
                    tbody.appendChild(tr);
                    setTimeout(() => tr.style.opacity = '1', 50);
                    
                    currentItem++;
                }

                if(progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    progressText.innerText = `Extraction Complete! Extracted ${totalItems} profiles.`;
                    progressRing.style.boxShadow = "0 0 20px rgba(16, 185, 129, 0.5)"; // Green glow on complete
                } else {
                    progressText.innerText = `Extracting data from @${handles[currentItem] || handles[handles.length-1]}...`;
                }

                progressVal.innerText = `${progress}%`;
                progressRing.style.background = `conic-gradient(var(--accent) ${progress * 3.6}deg, rgba(255,255,255,0.05) 0deg)`;

            }, 100);
        }
    </script>
</body>
</html>
